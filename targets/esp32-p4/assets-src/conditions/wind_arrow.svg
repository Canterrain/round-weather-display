<!-- Conditions-view wind arrow, drawn for wind FROM the north in the Pi's
     400x400 compass coordinates (targets/pi/public/index.html), cropped to
     the arrow's own strip (x 182..218). Rendered at the ESP32 compass size
     (334px tall) as an A8 image and rotated about its center at runtime;
     the faint shaft's lower opacity is baked into the alpha. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="182 0 36 400">
  <line x1="200" y1="14" x2="200" y2="366" stroke="#fff" stroke-opacity="0.32" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <path d="M186 2 L200 16 L214 2 M186 12 L200 26 L214 12 M186 22 L200 36 L214 22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M200 394 L216 366 L184 366 Z" fill="#fff"/>
</svg>
