<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>House Messages</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(64, 89, 139, 0.24) 0%, rgba(14, 20, 32, 0.96) 48%, #06080e 100%);
      color: rgba(246, 250, 255, 0.94);
      font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    }

    body {
      padding: 24px 16px 48px;
    }

    .messages-admin {
      max-width: 680px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
    }

    .compose-panel,
    .active-panel {
      border-radius: 24px;
      padding: 22px 18px;
      background: rgba(16, 23, 37, 0.76);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.06),
        0 12px 30px rgba(0, 0, 0, 0.22);
    }

    h1,
    h2 {
      margin: 0 0 18px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    h1 {
      font-size: 30px;
    }

    h2 {
      font-size: 24px;
    }

    .field,
    .field-row {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .field-row {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field span {
      font-size: 15px;
      font-weight: 600;
      color: rgba(230, 239, 250, 0.78);
    }

    textarea,
    input,
    select,
    button {
      font: inherit;
    }

    textarea,
    input,
    select {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(248, 251, 255, 0.96);
      box-sizing: border-box;
    }

    textarea {
      min-height: 116px;
      resize: vertical;
    }

    .primary-button {
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      background: linear-gradient(180deg, rgba(107, 155, 255, 0.96), rgba(68, 116, 214, 0.96));
      color: white;
      font-weight: 650;
    }

    .compose-status {
      min-height: 20px;
      margin-top: 10px;
      font-size: 15px;
      color: rgba(232, 239, 251, 0.72);
    }

    .active-messages {
      display: grid;
      gap: 12px;
    }

    .admin-message {
      display: grid;
      gap: 8px;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .admin-message-text {
      font-size: 22px;
      font-weight: 560;
      line-height: 1.18;
    }

    .admin-message-meta {
      font-size: 15px;
      color: rgba(224, 234, 247, 0.66);
    }

    .admin-message-actions {
      display: flex;
      justify-content: flex-end;
    }

    .admin-message-actions button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(247, 250, 255, 0.94);
    }
  </style>
</head>
<body>
  <main class="messages-admin">
    <section class="compose-panel">
      <h1>House Messages</h1>
      <label class="field">
        <span>Message</span>
        <textarea id="msg-text" maxlength="180" placeholder="Dinner is Ready"></textarea>
      </label>
      <label class="field">
        <span>Sender</span>
        <input id="msg-sender" type="text" maxlength="40" placeholder="Alex" />
      </label>
      <div class="field-row">
        <label class="field">
          <span>Target</span>
          <select id="msg-target"></select>
        </label>
        <label class="field">
          <span>Priority</span>
          <select id="msg-priority">
            <option value="normal">Normal</option>
            <option value="important">Important</option>
          </select>
        </label>
      </div>
      <label class="field">
        <span>Expires</span>
        <input id="msg-expires" type="datetime-local" />
      </label>
      <button id="send-message" class="primary-button">Send Message</button>
      <div id="compose-status" class="compose-status" aria-live="polite"></div>
    </section>

    <section class="active-panel">
      <h2>Active Messages</h2>
      <div id="active-messages" class="active-messages"></div>
    </section>
  </main>

  <script>
    function formatAdminMessageTime(isoString) {
      if (!isoString) return '';
      var date = new Date(isoString);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString('en-US', {
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      });
    }

    async function loadTargets() {
      var select = document.getElementById('msg-target');
      if (!select) return;

      try {
        var response = await fetch('/api/message-targets', { cache: 'no-store' });
        var data = await response.json();
        var targets = Array.isArray(data.targets) ? data.targets : [{ id: 'all', label: 'All clocks' }];
        var previousValue = select.value;
        select.replaceChildren();

        targets.forEach(function (target) {
          var option = document.createElement('option');
          option.value = target.id;
          option.textContent = target.label;
          select.appendChild(option);
        });

        if (previousValue && targets.some(function (target) { return target.id === previousValue; })) {
          select.value = previousValue;
        }
      } catch (error) {
        console.error('Failed to load message targets:', error);
      }
    }

    function setComposeStatus(text, isError) {
      var status = document.getElementById('compose-status');
      if (!status) return;
      status.textContent = text;
      status.style.color = isError ? 'rgba(255, 164, 164, 0.96)' : 'rgba(232, 239, 251, 0.72)';
    }

    async function loadActiveMessages() {
      var list = document.getElementById('active-messages');
      if (!list) return;

      try {
        var response = await fetch('/api/messages?deviceId=all&includeDismissed=true', { cache: 'no-store' });
        var data = await response.json();
        var messages = Array.isArray(data.messages) ? data.messages : [];
        list.replaceChildren();

        if (messages.length === 0) {
          var empty = document.createElement('div');
          empty.className = 'admin-message-meta';
          empty.textContent = 'No active messages.';
          list.appendChild(empty);
          return;
        }

        messages.forEach(function (message) {
          var item = document.createElement('div');
          item.className = 'admin-message';

          var metaBits = [];
          if (message.target === 'all') {
            metaBits.push('All clocks');
          } else {
            metaBits.push(message.target);
          }
          if (message.sender) {
            metaBits.push('from ' + message.sender);
          }
          if (message.createdAt) {
            metaBits.push(formatAdminMessageTime(message.createdAt));
          }

          item.innerHTML =
            '<div class="admin-message-text"></div>' +
            '<div class="admin-message-meta"></div>' +
            '<div class="admin-message-actions">' +
            '<button type="button" data-id="' + String(message.id).replace(/"/g, '&quot;') + '">Deactivate</button>' +
            '</div>';
          item.querySelector('.admin-message-text').textContent = message.text;
          item.querySelector('.admin-message-meta').textContent = metaBits.join(' · ');

          list.appendChild(item);
        });

        list.querySelectorAll('button[data-id]').forEach(function (button) {
          button.addEventListener('click', async function () {
            try {
              var response = await fetch('/api/messages/' + encodeURIComponent(button.dataset.id) + '/deactivate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
              });
              var data = await response.json();
              if (!response.ok || data.error) {
                setComposeStatus(data.error || 'Failed to deactivate message', true);
                return;
              }
              await loadActiveMessages();
            } catch (error) {
              console.error('Failed to deactivate message:', error);
              setComposeStatus('Failed to deactivate message', true);
            }
          });
        });
      } catch (error) {
        console.error('Failed to load active messages:', error);
        setComposeStatus('Failed to load active messages', true);
      }
    }

    function setupMessageForm() {
      var button = document.getElementById('send-message');
      if (!button) return;

      button.addEventListener('click', async function () {
        var text = document.getElementById('msg-text');
        var sender = document.getElementById('msg-sender');
        var target = document.getElementById('msg-target');
        var priority = document.getElementById('msg-priority');
        var expires = document.getElementById('msg-expires');

        var payload = {
          text: (text && text.value) || '',
          sender: (sender && sender.value) || '',
          target: (target && target.value) || 'all',
          priority: (priority && priority.value) || 'normal',
          expiresAt: (expires && expires.value) ? new Date(expires.value).toISOString() : null
        };

        try {
          var response = await fetch('/api/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          var data = await response.json();
          if (!response.ok || data.error) {
            setComposeStatus(data.error || 'Failed to send message', true);
            return;
          }

          if (text) text.value = '';
          if (sender) sender.value = '';
          if (expires) expires.value = '';
          if (priority) priority.value = 'normal';

          setComposeStatus('Message sent.');
          await loadActiveMessages();
        } catch (error) {
          console.error('Failed to send message:', error);
          setComposeStatus('Failed to send message', true);
        }
      });
    }

    async function initializeMessagesAdmin() {
      await loadTargets();
      setupMessageForm();
      await loadActiveMessages();

      // Targets and messages can change from other devices (hub election
      // settling, another clock sending a message), so keep both lists
      // live instead of freezing them at page-load time.
      setInterval(loadTargets, 5000);
      setInterval(loadActiveMessages, 5000);
    }

    initializeMessagesAdmin();
  </script>
</body>
</html>
