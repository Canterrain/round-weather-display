<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clock Weather Display</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <main class="app-shell">
    <section class="clock-stage" aria-label="Analog weather clock">
      <div class="view-layer view-clock" aria-hidden="false">
        <div class="clock-face">
          <div class="message-edge-indicator" data-message-edge-indicator aria-hidden="true"></div>
          <div class="weather-edge-indicator" data-weather-edge-indicator aria-hidden="true"></div>
          <div id="day" class="day-label">Thursday</div>
          <div id="date-short" class="date-short">Mar 19</div>

          <img id="current-icon" class="weather-icon weather-icon-bg" src="assets/icons/partlycloudy-day.svg" alt="Weather icon"/>
          <svg id="dial-svg" class="dial-svg dial-face-svg" viewBox="0 0 760 760" aria-hidden="true">
            <g id="dial-ticks"></g>
            <g id="dial-numerals"></g>
          </svg>
          <svg id="dial-hands-svg" class="dial-svg dial-hands-svg" viewBox="0 0 760 760" aria-hidden="true">
            <g id="dial-hands">
              <g id="hour-hand-group">
                <path id="hour-hand" class="dial-hand hour-hand-svg"></path>
                <path id="hour-hand-left-facet" class="dial-hand-facet hour-hand-left-facet-svg"></path>
                <path id="hour-hand-right-facet" class="dial-hand-facet hour-hand-right-facet-svg"></path>
                <path id="hour-hand-ridge" class="dial-hand-ridge hour-hand-ridge-svg"></path>
              </g>
              <g id="minute-hand-group">
                <path id="minute-hand" class="dial-hand minute-hand-svg"></path>
                <path id="minute-hand-left-facet" class="dial-hand-facet minute-hand-left-facet-svg"></path>
                <path id="minute-hand-right-facet" class="dial-hand-facet minute-hand-right-facet-svg"></path>
                <path id="minute-hand-ridge" class="dial-hand-ridge minute-hand-ridge-svg"></path>
              </g>
              <g id="second-hand-group">
                <path id="second-hand" class="dial-hand second-hand-svg"></path>
              </g>
              <g id="center-cap-group">
                <circle id="center-cap-outer" class="center-cap-outer-svg" cx="380" cy="380" r="15"></circle>
                <circle id="center-cap-inner" class="center-cap-inner-svg" cx="380" cy="380" r="8"></circle>
              </g>
            </g>
          </svg>

          <div class="center-display">
            <div id="current-temp" class="current-temp">52°</div>
            <div id="high-low" class="high-low">H:61°&nbsp;&nbsp;L:48°</div>
          </div>
        </div>
      </div>
      <div class="view-layer view-digital" aria-hidden="true">
        <div class="digital-face">
          <div class="message-edge-indicator" data-message-edge-indicator aria-hidden="true"></div>
          <div class="weather-edge-indicator" data-weather-edge-indicator aria-hidden="true"></div>
          <div id="digital-day" class="digital-day">WEDNESDAY</div>
          <div id="digital-date" class="digital-date">APR 1</div>
          <div class="digital-time-block">
            <div id="digital-time" class="digital-time">10:42</div>
            <div id="digital-meridiem" class="digital-meridiem">AM</div>
          </div>
          <div class="digital-divider digital-divider-top"></div>
          <div class="digital-current">
            <div id="digital-current-temp" class="digital-current-temp">56°</div>
            <img id="digital-current-icon" class="digital-current-icon" src="assets/icons/partlycloudy-day.svg" alt="Current weather icon"/>
            <div class="digital-current-copy">
              <div id="digital-current-summary" class="digital-current-summary">Partly Cloudy</div>
              <div id="digital-current-high-low" class="digital-current-high-low">H:80°&nbsp;&nbsp;L:52°</div>
            </div>
          </div>
          <div class="digital-divider digital-divider-bottom"></div>
          <div id="digital-forecast-list" class="digital-forecast-list"></div>
        </div>
      </div>
      <div class="view-layer view-forecast" aria-hidden="true">
        <div class="forecast-face">
          <svg class="forecast-tomorrow-frame" viewBox="0 0 408 408" aria-hidden="true">
            <defs>
              <radialGradient id="forecast-tomorrow-disc-gradient" cx="46%" cy="34%" r="72%">
                <stop offset="0%" stop-color="rgba(98, 141, 214, 0.22)"></stop>
                <stop offset="52%" stop-color="rgba(53, 78, 126, 0.16)"></stop>
                <stop offset="100%" stop-color="rgba(14, 22, 39, 0.12)"></stop>
              </radialGradient>
            </defs>
            <circle class="forecast-tomorrow-disc" cx="204" cy="204" r="189"></circle>
            <circle class="forecast-tomorrow-ring-outer" cx="204" cy="204" r="202.75"></circle>
            <circle class="forecast-tomorrow-ring-inner" cx="204" cy="204" r="191"></circle>
          </svg>
          <div id="forecast-tomorrow" class="forecast-tomorrow">
            <div class="forecast-tomorrow-label">Tomorrow</div>
            <img id="forecast-tomorrow-icon" class="forecast-tomorrow-icon" src="assets/icons/partlycloudy-day.svg" alt="Tomorrow forecast icon"/>
            <div id="forecast-tomorrow-temps" class="forecast-tomorrow-temps">61° / 48°</div>
          </div>
          <div id="forecast-list" class="forecast-list forecast-list-secondary">
          </div>
        </div>
      </div>
      <div class="view-layer view-conditions" aria-hidden="true">
        <div class="conditions-face">
          <!-- Headline and detail curve along the top of the circle, so long
               lines follow the edge instead of running into the bezel. -->
          <svg class="conditions-arc" viewBox="0 0 760 760" aria-hidden="true">
            <defs>
              <path id="conditions-arc-headline-path" d="M 58 380 A 322 322 0 0 1 702 380"></path>
              <path id="conditions-arc-detail-path" d="M 94 380 A 286 286 0 0 1 666 380"></path>
            </defs>
            <text class="conditions-headline"><textPath id="conditions-headline" href="#conditions-arc-headline-path" startOffset="50%" text-anchor="middle">Checking the weather&hellip;</textPath></text>
            <text class="conditions-detail"><textPath id="conditions-detail" href="#conditions-arc-detail-path" startOffset="50%" text-anchor="middle"></textPath></text>
          </svg>
          <svg class="conditions-dial" viewBox="0 0 400 400" aria-hidden="true">
            <circle class="conditions-dial-ring" cx="200" cy="200" r="182"></circle>
            <g id="conditions-dial-ticks"></g>
            <text class="conditions-dial-cardinal" x="200" y="52">N</text>
            <text class="conditions-dial-cardinal" x="348" y="200">E</text>
            <text class="conditions-dial-cardinal" x="200" y="348">S</text>
            <text class="conditions-dial-cardinal" x="52" y="200">W</text>
            <!-- Drawn for wind FROM the north, then rotated to the real
                 direction: a weathervane-style arrow with its fletching on
                 the upwind side and its head on the downwind side, so it
                 reads in the direction the wind is moving. The shaft
                 crosses faintly behind the readout. -->
            <g id="conditions-wind-flow" class="conditions-wind-flow" style="display: none">
              <line class="conditions-wind-flow-line" x1="200" y1="14" x2="200" y2="366"></line>
              <path class="conditions-wind-flow-fletch" d="M186 2 L200 16 L214 2 M186 12 L200 26 L214 12 M186 22 L200 36 L214 22"></path>
              <path class="conditions-wind-flow-head" d="M200 394 L216 366 L184 366 Z"></path>
            </g>
          </svg>
          <div class="conditions-wind">
            <div class="conditions-wind-speed-row">
              <span id="conditions-wind-speed" class="conditions-wind-speed">--</span>
              <span id="conditions-wind-unit" class="conditions-wind-unit">mph</span>
            </div>
            <div id="conditions-wind-from" class="conditions-wind-from">&nbsp;</div>
            <div id="conditions-wind-gust" class="conditions-wind-gust">&nbsp;</div>
          </div>
          <div class="conditions-divider">
            <span class="conditions-divider-line"></span>
            <span id="conditions-change-label" class="conditions-divider-label">&nbsp;</span>
            <span class="conditions-divider-line"></span>
          </div>
          <div class="conditions-columns">
            <div class="conditions-col conditions-col-wind">
              <svg class="conditions-col-icon" viewBox="0 0 32 32" aria-hidden="true">
                <path d="M4 12 H19 a4 4 0 1 0 -4 -4"></path>
                <path d="M4 18 H25 a4 4 0 1 1 -4 4"></path>
                <path d="M4 24 H13"></path>
              </svg>
              <div class="conditions-col-label">Wind</div>
              <div id="conditions-wind-outlook-status" class="conditions-col-value">--</div>
            </div>
            <div class="conditions-col conditions-col-pressure">
              <svg class="conditions-col-icon" viewBox="0 0 32 32" aria-hidden="true">
                <circle cx="16" cy="17" r="11"></circle>
                <path d="M16 17 L21 11"></path>
                <path d="M9 21 h2 M21 21 h2 M16 9 v2"></path>
              </svg>
              <div class="conditions-col-label">Pressure</div>
              <div id="conditions-pressure-status" class="conditions-col-value">--</div>
            </div>
            <div class="conditions-col conditions-col-precip">
              <svg class="conditions-col-icon" viewBox="0 0 32 32" aria-hidden="true">
                <path id="conditions-precip-icon-rain" d="M16 4 C11 11 8 15 8 19 a8 8 0 0 0 16 0 c0 -4 -3 -8 -8 -15 Z"></path>
                <path id="conditions-precip-icon-snow" style="display: none" d="M16 4 V28 M5.6 10 L26.4 22 M5.6 22 L26.4 10 M12 6 L16 9 L20 6 M12 26 L16 23 L20 26"></path>
              </svg>
              <div id="conditions-precip-label" class="conditions-col-label">Rain</div>
              <div id="conditions-precip-status" class="conditions-col-value">--</div>
            </div>
          </div>
        </div>
      </div>
      <div class="view-layer view-message" aria-hidden="true">
        <div class="message-face">
          <div class="message-title">Message</div>
          <div id="message-card" class="message-card" hidden>
            <div id="message-text" class="message-text">Dinner is Ready</div>
            <div id="message-meta" class="message-meta">-Alex, 5:30 PM</div>
            <div class="message-dismiss">Tap to dismiss</div>
          </div>
          <div id="message-empty" class="message-empty">No messages</div>
        </div>
      </div>
      <!-- Contents built lazily by wifi.js on first open, not at page load --
           this screen is rarely used (WiFi recovery), and this device is
           memory-constrained enough that keeping its DOM (title, list,
           password panel, ~40 keyboard buttons) resident at all times was
           competing with the views actually in regular rotation, causing
           them to get paged out to swap when idle and lag on the next
           swipe back to them -- see targets/pi/public/renderer/wifi.js. -->
      <!-- Built lazily by settings.js on first open, like the WiFi screen. -->
      <div class="view-layer view-settings" aria-hidden="true"></div>
      <div class="view-layer view-wifi" aria-hidden="true"></div>
      <div class="status-stack" aria-live="polite" aria-atomic="true">
        <div id="clock-status" class="status-line-round" hidden></div>
        <div id="weather-status" class="status-line-round" hidden></div>
      </div>
    </section>
  </main>

  <script src="renderer/clock.js"></script>
  <script src="renderer/weather.js"></script>
  <script src="renderer/keyboard.js"></script>
  <script src="renderer/wifi.js"></script>
  <script src="renderer/settings.js"></script>
  <script src="renderer/messages.js"></script>
  <script src="background-switcher.js"></script>
</body>
</html>
